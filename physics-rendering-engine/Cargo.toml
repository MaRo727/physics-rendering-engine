[package]
name = "physics-rendering-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# Vulkan bindings
ash = "0.38"

# Windowing and input
winit = "0.30"

# Physics simulation
rapier3d = "0.22"

# Math
glam = "0.29"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Software framebuffer (for testing window visibility before Vulkan)
softbuffer = "0.4"
