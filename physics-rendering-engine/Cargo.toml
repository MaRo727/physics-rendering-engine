[package]
name = "physics-rendering-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# Vulkan bindings
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"

# Windowing and input
winit = "0.30"

# Physics simulation
rapier3d = "0.22"

# Noise generation
noise = "0.9"

# Math
glam = "0.29"
smallvec = "1"

# Error handling
anyhow = "1"

# Audio
rodio = "0.20"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# 3D model loading
gltf = { version = "1", features = ["import"] }

# Logging

log = "0.4"
env_logger = "0.11"

[profile.release]
debug = true

